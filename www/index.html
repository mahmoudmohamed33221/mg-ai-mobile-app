<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MG.ai CODER</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Header */
    header { background-color: #1e293b; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.2rem; color: #38bdf8; font-weight: bold; }
    header .badge { background-color: #0369a1; color: #e0f2fe; font-size: 0.75rem; padding: 4px 8px; borderRadius: 6px; }

    /* Chat Area */
    #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
    .bot { background-color: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-right-radius: 2px; border: 1px solid #334155; }
    .user { background-color: #0284c7; color: #ffffff; align-self: flex-end; border-bottom-left-radius: 2px; }
    
    /* Code Blocks */
    pre { background-color: #090d16; padding: 10px; border-radius: 8px; overflow-x: auto; font-family: monospace; dir: ltr; text-align: left; margin-top: 8px; border: 1px solid #1e293b; color: #38bdf8; }

    /* Input Area */
    footer { background-color: #1e293b; padding: 12px; border-top: 1px solid #334155; display: flex; gap: 8px; }
    textarea { flex: 1; background-color: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px 14px; border-radius: 8px; resize: none; font-size: 0.95rem; outline: none; height: 44px; }
    textarea:focus { border-color: #0284c7; }
    button { background-color: #0284c7; color: white; border: none; padding: 0 18px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { background-color: #0369a1; }
  </style>
</head>
<body>

  <header>
    <h1>MG.ai CODER</h1>
    <span class="badge">تطوير: محمود جابر</span>
  </header>

  <div id="chat-container">
    <div class="message bot">
      أهلاً بك! أنا <b>MG.ai CODER</b>، مساعدك البرمجي المطوّر بالكامل بواسطة المبرمج <b>محمود جابر</b>.<br><br>
      كيف يمكنني مساعدتك في مشروعك اليوم؟
    </div>
  </div>

  <footer>
    <textarea id="user-input" placeholder="اكتب سؤالك أو الكود هنا..."></textarea>
    <button onclick="sendMessage()">إرسال</button>
  </footer>

  <script>
    function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      // أضف رسالة المستخدم
      appendMessage(text, 'user');
      input.value = '';

      // رد المساعد التلقائي (مبدئي محلي)
      setTimeout(() => {
        const reply = "تم استلام طلبك بنجاح! النظام في وضع التشغيل المحلي جاهز لمعالجة الأكواد والمشاريع.";
        appendMessage(reply, 'bot');
      }, 600);
    }

    function appendMessage(text, sender) {
      const container = document.getElementById('chat-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerHTML = text.replace(/\n/g, '<br>');
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }
  </script>

</body>
</html>
