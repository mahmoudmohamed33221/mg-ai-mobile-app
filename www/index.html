<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060B07">
<meta name="color-scheme" content="dark">
<title>MG.ai CODER — التطبيق المستقل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060B07;
    --bg-panel:#0A130C;
    --bg-elevated:#0F1D12;
    --border:#1E3A22;
    --border-soft:#152A18;
    --text-primary:#DFFCE4;
    --text-secondary:#7FB98D;
    --text-muted:#4E7857;
    --accent:#39FF14;
    --accent-soft:rgba(57,255,20,0.14);
    --radius-md:10px;
    --font-body:'IBM Plex Sans Arabic', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;width:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--text-primary);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}

  .app{
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
    max-width:820px;margin:0 auto;
    overflow:hidden;
  }

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom:1px solid var(--border-soft);
    background:rgba(10,19,12,0.95);
    backdrop-filter:blur(10px);
  }
  .brand-row{display:flex;align-items:center;gap:8px;}
  .brand-logo{
    width:28px;height:28px;border-radius:8px;
    background:var(--accent-soft);color:var(--accent);border:1px solid rgba(57,255,20,0.35);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:12px;font-weight:700;
  }
  .brand-mark{font-family:var(--font-mono);font-weight:700;font-size:16px;}
  .brand-mark span{color:var(--accent);}
  .brand-sub{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);}

  .icon-btn{
    width:36px;height:36px;border-radius:6px;
    border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);
    font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }

  /* حل مشكلة التمرير الشامل والسكرول لأحدث رسالة */
  .chat{
    flex:1;overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:14px;
    -webkit-overflow-scrolling:touch;
    padding-bottom:30px;
  }
  .chat::-webkit-scrollbar{width:4px;}
  .chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .empty-state{
    margin:auto;max-width:440px;width:100%;
    padding:28px 20px;text-align:center;
    border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-panel);
  }
  .empty-title{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:8px;}
  .empty-desc{font-size:13px;color:var(--text-secondary);line-height:1.8;}

  .messages{display:flex;flex-direction:column;gap:12px;}
  .msg-row{display:flex;width:100%;}
  .msg-row.is-assistant{justify-content:flex-start;}
  .msg-row.is-user{justify-content:flex-end;}

  .msg-col{display:flex;flex-direction:column;gap:6px;max-width:88%;min-width:0;}
  .bubble{padding:12px 16px;border-radius:var(--radius-md);font-size:14.5px;line-height:1.8;word-break:break-word;}
  .is-assistant .bubble{background:var(--bg-panel);border:1px solid var(--border);border-start-start-radius:2px;}
  .is-user .bubble{background:var(--accent-soft);border:1px solid rgba(57,255,20,0.35);border-end-end-radius:2px;}

  pre{
    background:#040A05;padding:12px;border-radius:8px;overflow-x:auto;
    font-family:var(--font-mono);font-size:13px;dir:ltr;text-align:left;
    border:1px solid var(--border);margin-top:8px;color:#8CFF6B;
  }

  .composer{
    flex-shrink:0;display:flex;flex-direction:column;gap:8px;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border-soft);background:var(--bg-panel);
  }
  .composer-row{display:flex;align-items:center;gap:8px;}
  .composer textarea{
    flex:1;resize:none;max-height:120px;min-height:44px;
    background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);
    color:var(--text-primary);font-size:14.5px;padding:10px 14px;outline:none;
  }

  .send-btn{
    width:44px;height:44px;flex-shrink:0;border-radius:var(--radius-md);border:none;
    background:var(--accent);color:#04140A;font-size:18px;font-weight:700;cursor:pointer;
  }

  /* نافذة الإعدادات والذاكرة التلقائية */
  .modal{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.85);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-card{
    background:var(--bg-panel);border:1px solid var(--border);
    border-radius:var(--radius-md);width:100%;max-width:460px;padding:20px;
  }
  .modal-card h3{color:var(--accent);margin-bottom:12px;}
  .modal-card input{
    width:100%;padding:10px;background:var(--bg-elevated);border:1px solid var(--border);
    color:#fff;border-radius:6px;margin-bottom:12px;font-family:var(--font-mono);
  }
  .modal-card button{
    width:100%;padding:10px;background:var(--accent);color:#04140A;
    border:none;border-radius:6px;font-weight:bold;cursor:pointer;
  }
</style>
</head>
<body>

  <div class="app">
    <header class="topbar">
      <div class="brand-row">
        <span class="brand-logo">&lt;/&gt;</span>
        <div>
          <div class="brand-mark">MG.ai <span>CODER</span></div>
          <div class="brand-sub">تطوير: محمود جابر</div>
        </div>
      </div>
      <div>
        <button type="button" class="icon-btn" onclick="openSettings()" title="الإعدادات">⚙</button>
        <button type="button" class="icon-btn" onclick="clearChat()" title="محادثة جديدة">✚</button>
      </div>
    </header>

    <main class="chat" id="chatArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-title">MG.ai CODER — ذاكرة محفوظة 100%</div>
        <div class="empty-desc">
          أهلاً بك يا مهندس محمود! المحادثات والأكواد محفوظة تلقائياً على جهازك.<br>
          اضغط على زر ⚙ الضبط لإدخال التوكن أو إعدادات التحديث الذاتي.
        </div>
      </div>
      <div class="messages" id="messagesList"></div>
    </main>

    <form class="composer" onsubmit="event.preventDefault(); sendMessage();">
      <div class="composer-row">
        <textarea id="userInput" rows="1" placeholder="اكتب سؤالك أو الكود هنا..."></textarea>
        <button type="submit" class="send-btn">↑</button>
      </div>
    </form>
  </div>

  <!-- modal الإعدادات والذاكرة -->
  <div class="modal" id="settingsModal" style="display:none;">
    <div class="modal-card">
      <h3>إعدادات الذاكرة والتحديث الذاتي</h3>
      <label style="font-size:12px;color:var(--text-secondary);">GitHub Token (للتحديث الذاتي مستقبلاً):</label>
      <input type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxxxx">
      <button onclick="saveSettings()">حفظ وإغلاق</button>
    </div>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
    const messagesList = document.getElementById('messagesList');
    const emptyState = document.getElementById('emptyState');
    const userInput = document.getElementById('userInput');

    // استرجاع الذاكرة المحفوظة عند التشغيل
    let memory = JSON.parse(localStorage.getItem('mg_ai_memory') || '[]');
    let ghToken = localStorage.getItem('mg_ai_gh_token') || '';

    function initMemory() {
      if (memory.length > 0) {
        emptyState.style.display = 'none';
        memory.forEach(msg => renderMessageUI(msg.role, msg.content));
        scrollToBottom();
      }
    }

    function scrollToBottom() {
      requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
    }

    function saveMemory(role, content) {
      memory.push({ role, content });
      localStorage.setItem('mg_ai_memory', JSON.stringify(memory));
    }

    function clearChat() {
      memory = [];
      localStorage.removeItem('mg_ai_memory');
      messagesList.innerHTML = '';
      emptyState.style.display = 'block';
    }

    function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      emptyState.style.display = 'none';
      appendMessage('user', text);
      userInput.value = '';

      setTimeout(() => {
        let reply = "تم استلام الطلب والحفظ التلقائي في ذاكرة الجهاز يا مهندس محمود.";
        if(text.includes('كود')) {
          reply = "إليك كود تفاعلي تم إنشاؤه وتخزينه:\n```html\n<button onclick='alert(\"MG.ai CODER!\")'>تأكيد الذاكرة</button>\n```";
        }
        appendMessage('assistant', reply);
      }, 500);
    }

    function appendMessage(role, content) {
      saveMemory(role, content);
      renderMessageUI(role, content);
    }

    function renderMessageUI(role, content) {
      const msgRow = document.createElement('div');
      msgRow.className = `msg-row ${role === 'user' ? 'is-user' : 'is-assistant'}`;
      const msgCol = document.createElement('div');
      msgCol.className = 'msg-col';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      
      bubble.innerHTML = content.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>').replace(/\n/g, '<br>');
      
      msgCol.appendChild(bubble);
      msgRow.appendChild(msgCol);
      messagesList.appendChild(msgRow);
      scrollToBottom();
    }

    function openSettings() {
      document.getElementById('ghTokenInput').value = ghToken;
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function saveSettings() {
      ghToken = document.getElementById('ghTokenInput').value.trim();
      localStorage.setItem('mg_ai_gh_token', ghToken);
      document.getElementById('settingsModal').style.display = 'none';
    }

    // تشغيل الذاكرة تلقائياً عند فتح التطبيق
    initMemory();
  </script>
</body>
</html>
