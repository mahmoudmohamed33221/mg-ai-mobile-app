<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>متجر الورد والذكريات</title>
    <style>
        :root {
            --bg: #060B07;
            --bg-panel: #0A130C;
            --accent: #39FF14;
            --text-primary: #DFFCE4;
            --text-secondary: #7FB98D;
            --border: #1E3A22;
        }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            padding: 20px;
            text-align: center;
            background: var(--bg-panel);
            border-bottom: 2px solid var(--border);
        }
        h1 { margin: 0; color: var(--accent); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .card h3 { margin: 0 0 10px; font-size: 16px; }
        .card p { font-size: 12px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <header>
        <h1>متجر الورد والذكريات</h1>
    </header>
    <div class="grid">
        <div class="card" onclick="window.location.href='ward/index.html'"><h3>🌸 متجر الورد</h3><p>ادخلي تصفحي كل الشغل</p></div>
        <div class="card" onclick="alert('بوكيهات فراشات')"><h3>🦋 بوكيهات فراشات</h3></div>
        <div class="card" onclick="alert('بوكيهات صور')"><h3>📸 بوكيهات صور</h3></div>
        <div class="card" onclick="alert('بوكيهات ستان')"><h3>🎀 بوكيهات ستان</h3></div>
        <div class="card" onclick="alert('بوكيهات هاند ميد')"><h3>✨ بوكيهات هاند ميد</h3></div>
        <div class="card" onclick="alert('صواني كتب كتاب')"><h3>💍 صواني كتب كتاب</h3></div>
        <div class="card" onclick="alert('مناديل كتب كتاب')"><h3>📜 مناديل كتب كتاب</h3></div>
    </div>
</body>
</html>
