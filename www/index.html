<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060B07">
<meta name="color-scheme" content="dark">
<meta name="description" content="MG.ai CODER — مساعد برمجة احترافي مبني على Gemini API — متخصص في HTML وCSS وJavaScript والفرونت إند والباك إند">
<title>MG.ai CODER — مساعد برمجة احترافي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060B07;
    --bg-panel:#0A130C;
    --bg-elevated:#0F1D12;
    --bg-elevated-2:#152616;
    --border:#1E3A22;
    --border-soft:#152A18;
    --text-primary:#DFFCE4;
    --text-secondary:#7FB98D;
    --text-muted:#4E7857;
    --accent:#39FF14;
    --accent-strong:#8CFF6B;
    --accent-soft:rgba(57,255,20,0.14);
    --amber:#F0AA3C;
    --danger:#FF4136;
    --danger-soft:rgba(255,65,54,0.12);
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --font-body:'IBM Plex Sans Arabic','Inter',sans-serif;
    --font-mono:'JetBrains Mono','Courier New',monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;width:100%;overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--text-primary);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea{font-family:inherit;}
  [hidden]{display:none !important;}

  .matrix-canvas{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    opacity:.62;
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, black, transparent 88%);
    mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, black, transparent 88%);
  }

  .app{
    position:relative;z-index:1;
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
    max-width:820px;margin:0 auto;
    overflow:hidden;
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 18px 10px;flex-shrink:0;gap:10px;
    border-bottom:1px solid var(--border-soft);
    background:rgba(10,19,12,0.92);
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand-row{display:flex;align-items:center;gap:7px;}
  .brand-logo{
    width:24px;height:24px;flex-shrink:0;border-radius:7px;
    background:var(--accent-soft);color:var(--accent);border:1px solid rgba(57,255,20,0.35);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:11px;font-weight:700;
  }
  .brand-mark{font-family:var(--font-mono);font-weight:700;font-size:15.5px;letter-spacing:.5px;direction:ltr;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-mark span{color:var(--accent);text-shadow:0 0 12px rgba(57,255,20,0.45);}
  .brand-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;color:var(--text-muted);padding-inline-start:31px;}
  .topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .status-pill{
    display:flex;align-items:center;gap:6px;
    font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);
    padding:5px 10px;border:1px solid var(--border);border-radius:999px;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);flex-shrink:0;}
  .status-dot.is-ready{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
  .icon-btn{
    width:36px;height:36px;flex-shrink:0;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);
    font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;
  }
  .icon-btn:hover{color:var(--accent);border-color:var(--accent);}
  .icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- chat (مع إصلاح السكرول التام) ---------- */
  .chat{
    flex:1;overflow-y:auto;padding:20px 16px 45px;display:flex;flex-direction:column;
    -webkit-overflow-scrolling:touch;scroll-behavior:smooth;
  }
  .chat::-webkit-scrollbar{width:8px;}
  .chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .empty-state{
    position:relative;margin:auto;max-width:440px;width:100%;
    padding:30px 22px;text-align:center;
    border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-panel);
  }
  .corner{position:absolute;width:16px;height:16px;border-color:var(--accent);opacity:.55;}
  .corner-tl{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;}
  .corner-tr{top:-1px;right:-1px;border-top:2px solid;border-right:2px solid;}
  .corner-bl{bottom:-1px;left:-1px;border-bottom:2px solid;border-left:2px solid;}
  .corner-br{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;}
  .empty-title{font-size:16px;font-weight:700;margin:6px 0 8px;}
  .empty-desc{font-size:13px;color:var(--text-secondary);line-height:1.8;}

  .messages{display:flex;flex-direction:column;gap:12px;padding-bottom:10px;}
  .msg-row{display:flex;width:100%;}
  .msg-row.is-assistant{justify-content:flex-start;}
  .msg-row.is-user{justify-content:flex-end;}

  .msg-col{display:flex;flex-direction:column;gap:8px;max-width:84%;min-width:0;align-items:flex-start;}

  .bubble{max-width:100%;padding:12px 14px;border-radius:var(--radius-md);font-size:14.5px;line-height:1.85;}
  .is-assistant .bubble{background:var(--bg-panel);border:1px solid var(--border);border-start-start-radius:4px;}
  .is-user .bubble{background:var(--accent-soft);border:1px solid rgba(57,255,20,0.35);border-end-end-radius:4px;}
  .bubble.is-error{background:var(--danger-soft);border-color:rgba(255,65,54,0.4);color:#FFD9D6;}

  .bubble-attachments{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .bubble-attachment{max-width:170px;max-height:170px;border-radius:var(--radius-sm);border:1px solid var(--border);display:block;object-fit:cover;}

  .stream-text{white-space:pre-wrap;word-break:break-word;}
  .stream-text:empty::before{
    content:'●●●';color:var(--text-muted);letter-spacing:3px;font-size:11px;
    animation:blink-dots 1.4s ease-in-out infinite;
  }
  @keyframes blink-dots{0%,100%{opacity:.25;}50%{opacity:1;}}
  .stream-text p{margin:0 0 10px;}
  .stream-text p:last-child{margin-bottom:0;}
  .stream-text ul,.stream-text ol{margin:0 0 10px;padding-inline-start:20px;}
  .stream-text a{color:var(--accent);}
  .stream-text code:not(pre code){
    background:var(--bg-elevated-2);padding:2px 5px;border-radius:4px;
    font-family:var(--font-mono);font-size:.88em;direction:ltr;unicode-bidi:isolate;display:inline-block;
  }

  /* ---------- artifact card ---------- */
  .artifact-card{
    display:flex;align-items:center;gap:10px;
    background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:10px 12px;margin:0;cursor:pointer;transition:.15s;direction:ltr;
    width:264px;max-width:100%;
  }
  .artifact-card:hover{border-color:var(--accent);}
  .artifact-card-icon{
    width:36px;height:36px;flex-shrink:0;border-radius:var(--radius-sm);
    background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:13px;
  }
  .artifact-card-info{flex:1;min-width:0;}
  .artifact-card-title{font-size:13.5px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .artifact-card-sub{font-size:11.5px;color:var(--text-muted);font-family:var(--font-mono);}
  .artifact-download-btn{
    width:32px;height:32px;flex-shrink:0;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:transparent;color:var(--text-secondary);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .artifact-download-btn:hover{color:var(--accent);border-color:var(--accent);}

  /* ---------- full-screen artifact viewer ---------- */
  .artifact-overlay{
    position:fixed;inset:0;z-index:20;background:var(--bg);
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .artifact-overlay.open{opacity:1;pointer-events:auto;}
  .artifact-viewer{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto;width:100%;}
  .artifact-viewer-header{
    display:flex;align-items:center;gap:8px;flex-shrink:0;
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
    border-bottom:1px solid var(--border-soft);background:var(--bg-panel);
  }
  .artifact-view-toggle{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;flex-shrink:0;}
  .toggle-btn{
    width:32px;height:30px;background:var(--bg-elevated);border:none;color:var(--text-secondary);
    cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
  }
  .toggle-btn.active{background:var(--accent-soft);color:var(--accent);}
  .artifact-viewer-title{flex:1;min-width:0;font-size:12.5px;color:var(--text-secondary);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left;}
  .artifact-viewer-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .artifact-viewer-body{flex:1;overflow:hidden;position:relative;background:#040A05;}
  .artifact-preview-frame{width:100%;height:100%;border:0;display:block;background:#fff;}
  .artifact-code-view{width:100%;height:100%;overflow:auto;display:flex;align-items:flex-start;direction:ltr;}
  .code-gutter{
    flex-shrink:0;padding:14px 10px;text-align:right;user-select:none;
    font-family:var(--font-mono);font-size:12.5px;line-height:1.7;color:var(--text-muted);
    border-inline-end:1px solid var(--border);background:var(--bg-elevated-2);
  }
  .code-gutter div{white-space:nowrap;}
  .artifact-code-view pre{margin:0;padding:14px;flex:1;background:transparent !important;font-family:var(--font-mono);font-size:12.5px;line-height:1.7;direction:ltr;}
  .artifact-code-view pre code{background:none !important;padding:0 !important;}

  /* ---------- neon syntax highlighting ---------- */
  .hljs{color:var(--text-primary);background:transparent;}
  .hljs-comment,.hljs-quote{color:#5C8F68;font-style:italic;}
  .hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-type,.hljs-operator,.hljs-selector-class{color:var(--accent);font-weight:600;text-shadow:0 0 6px rgba(57,255,20,0.25);}
  .hljs-string,.hljs-regexp,.hljs-template-string{color:#FF4FCF;text-shadow:0 0 6px rgba(255,79,207,0.2);}
  .hljs-number{color:#FFB23C;}
  .hljs-title,.hljs-title.function_,.hljs-title.class_,.hljs-section{color:#4DFFEA;font-weight:600;text-shadow:0 0 6px rgba(77,255,234,0.25);}
  .hljs-attr,.hljs-attribute,.hljs-variable,.hljs-selector-attr,.hljs-selector-pseudo,.hljs-property{color:#FFE93C;}
  .hljs-built_in,.hljs-builtin-name,.hljs-class .hljs-title{color:#C56CFF;}
  .hljs-tag{color:#7FB98D;}
  .hljs-tag .hljs-name{color:var(--accent);font-weight:600;}
  .hljs-tag .hljs-attr{color:#FFE93C;}
  .hljs-name{color:#4DFFEA;}
  .hljs-params{color:var(--text-primary);}
  .hljs-meta,.hljs-meta .hljs-keyword{color:#7FB98D;}
  .hljs-symbol,.hljs-bullet,.hljs-link{color:#4DFFEA;}
  .hljs-deletion{color:#FF4136;background:rgba(255,65,54,0.1);}
  .hljs-addition{color:var(--accent);background:rgba(57,255,20,0.1);}
  .hljs-emphasis{font-style:italic;}
  .hljs-strong{font-weight:700;}
  .hljs-punctuation{color:var(--text-secondary);}

  .copy-btn{
    font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);background:transparent;
    border:1px solid var(--border);padding:5px 10px;border-radius:4px;cursor:pointer;
  }
  .copy-btn:hover{color:var(--accent);border-color:var(--accent);}

  /* ---------- composer ---------- */
  .composer{
    flex-shrink:0;display:flex;flex-direction:column;gap:8px;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border-soft);background:var(--bg-panel);
  }
  .composer-row{display:flex;align-items:flex-end;gap:8px;}
  .attach-btn{width:44px;height:44px;font-size:18px;}
  .composer textarea{
    flex:1;resize:none;max-height:160px;min-height:44px;
    background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);
    color:var(--text-primary);font-size:14.5px;padding:11px 14px;line-height:1.5;
  }
  .composer textarea:focus-visible,.composer textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  }
  .send-btn{
    width:44px;height:44px;flex-shrink:0;border-radius:var(--radius-md);border:none;
    background:var(--accent);color:#04140A;font-size:18px;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;
  }
  .send-btn:hover{background:var(--accent-strong);}
  .send-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .attachments-preview{display:flex;flex-wrap:wrap;gap:8px;}
  .attach-chip{position:relative;width:56px;height:56px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);background:var(--bg-elevated);flex-shrink:0;}
  .attach-chip img,.attach-chip video{width:100%;height:100%;object-fit:cover;display:block;}
  .attach-remove{
    position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,0.65);color:#fff;border:none;font-size:11px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }

  /* ---------- settings sheet ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(4,6,12,0.6);z-index:10;opacity:0;transition:opacity .25s;}
  .backdrop.open{opacity:1;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:520px;margin:0 auto;
    background:var(--bg-panel);border:1px solid var(--border);border-bottom:none;
    border-radius:18px 18px 0 0;padding:6px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .28s ease;max-height:88vh;overflow-y:auto;
  }
  .sheet.open{transform:translateY(0);}
  .sheet::-webkit-scrollbar{width:8px;}
  .sheet::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 14px;}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .sheet-title{font-family:var(--font-mono);font-size:13px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;}

  .warn-box{
    padding:10px 12px;background:rgba(240,170,60,0.08);border:1px solid rgba(240,170,60,0.3);
    border-radius:var(--radius-sm);font-size:12px;color:#F4C878;line-height:1.8;margin-bottom:16px;
  }

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--text-secondary);margin-bottom:6px;font-weight:600;}
  .field .hint{font-size:11.5px;color:var(--text-muted);margin-top:6px;line-height:1.7;}
  .field input[type=password],.field input[type=text]{
    width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text-primary);padding:10px 12px;font-family:var(--font-mono);font-size:13.5px;
    direction:ltr;text-align:left;
  }
  .field select{
    width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text-primary);padding:10px 12px;font-family:var(--font-mono);font-size:13px;
  }
  .field textarea{
    width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text-primary);padding:10px 12px;font-size:13.5px;direction:rtl;text-align:right;
    min-height:110px;resize:vertical;line-height:1.8;
  }
  .key-row{display:flex;gap:8px;}
  .key-row input{flex:1;}
  .text-btn{
    font-size:12.5px;color:var(--text-secondary);background:var(--bg-elevated);
    border:1px solid var(--border);padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;
  }

  .primary-btn{
    width:100%;padding:12px;background:var(--accent);color:#04140A;border:none;
    border-radius:var(--radius-md);font-weight:700;font-size:14.5px;cursor:pointer;margin-top:4px;
  }
  .primary-btn:hover{background:var(--accent-strong);}
  .ghost-btn{
    width:100%;padding:11px;background:transparent;color:var(--text-secondary);
    border:1px solid var(--border);border-radius:var(--radius-md);font-size:13.5px;cursor:pointer;margin-top:10px;
  }

  /* ---------- history sidebar ---------- */
  .sidebar{
    position:fixed;top:0;bottom:0;right:0;z-index:11;width:min(300px,85vw);
    background:var(--bg-panel);border-inline-start:1px solid var(--border);
    display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    transform:translateX(100%);transition:transform .28s ease;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .conversations-list{flex:1;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:4px;}
  .conv-item{
    display:flex;align-items:center;justify-content:space-between;gap:4px;
    padding:10px 10px;border-radius:var(--radius-sm);cursor:pointer;
    border:1px solid transparent;
  }
  .conv-item:hover{background:var(--bg-elevated);}
  .conv-item.is-active{background:var(--accent-soft);border-color:rgba(57,255,20,0.3);}
  .conv-item-title{font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .conv-item-actions{display:flex;align-items:center;flex-shrink:0;}
  .conv-edit-btn,.conv-delete-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:12.5px;flex-shrink:0;padding:3px 5px;}

  /* ---------- voice mode ---------- */
  .voice-overlay{
    position:fixed;inset:0;z-index:9;background:var(--bg);
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .voice-overlay.open{opacity:1;pointer-events:auto;}
  .voice-viewer{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto;width:100%;}
  .voice-viewer-header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .voice-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;min-height:0;}
  .voice-orb{position:relative;width:168px;height:168px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .voice-orb-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(57,255,20,0.3);}
  .voice-orb-core{
    width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--accent-strong), var(--accent) 55%, #0d3d0a 100%);
    box-shadow:0 0 40px rgba(57,255,20,0.35);
  }
  .voice-orb-bars{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:5px;}
  .voice-orb-bars span{width:5px;height:22px;border-radius:3px;background:var(--accent);opacity:.9;}
  .voice-status{font-size:14.5px;color:var(--text-secondary);text-align:center;}
  .voice-transcript{max-width:460px;width:100%;text-align:center;font-size:15.5px;line-height:1.85;color:var(--text-primary);}
  .voice-preset-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .voice-preset-btn{padding:9px 4px;font-size:12.5px;text-align:center;color:var(--text-secondary);background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;}
  .voice-preset-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);}
</style>
</head>
<body>

  <canvas class="matrix-canvas" id="matrixCanvas" aria-hidden="true"></canvas>

  <div class="app">
    <header class="topbar">
      <div class="brand">
