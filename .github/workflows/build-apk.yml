name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

# لو اتعمل commit جديد والبناء القديم لسه شغال، القديم بيتلغي والجديد بس هو اللي يكمّل
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      KS_FILE: keystore/mg-ai.jks
      KS_ALIAS: mgai
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'mgai-2026-release' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check web code (syntax)
        run: node scripts/check-web.js

      - name: Stamp build number
        run: |
          echo "{\"build\": ${BUILD_NUMBER}}" > www/version.json
          cat www/version.json

      - name: Initialize Project & Sync Web Assets
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/browser@7 @capacitor/filesystem@7 @capacitor/share@7
          npx cap init MG-ai com.mg.ai.app --web-dir www

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Add Android permissions (camera, mic, files)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO; do
            grep -q "android.permission.$P\"" "$M" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$M"
          done
          grep -q "READ_EXTERNAL_STORAGE" "$M" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />\n</manifest>#" "$M"
          grep -q "android.hardware.camera\"" "$M" || sed -i "s#</manifest>#    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n</manifest>#" "$M"
          grep -q "com.android.alarm.permission.SET_ALARM" "$M" || sed -i "s#</manifest>#    <uses-permission android:name=\"com.android.alarm.permission.SET_ALARM\" />\n</manifest>#" "$M"
          grep -n "uses-permission\|uses-feature" "$M"

      - name: Add native assistant plugin (alarm and timer)
        run: |
          D=android/app/src/main/java/com/mg/ai/app
          mkdir -p "$D"
          cat > "$D/AssistantPlugin.java" <<'JAVA_EOF'
          package com.mg.ai.app;

          import android.content.Intent;
          import android.provider.AlarmClock;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Assistant")
          public class AssistantPlugin extends Plugin {

              @PluginMethod
              public void setAlarm(PluginCall call) {
                  Integer hour = call.getInt("hour");
                  Integer minute = call.getInt("minute");
                  if (hour == null || minute == null) {
                      call.reject("hour and minute are required");
                      return;
                  }
                  String label = call.getString("label", "MG.ai");
                  Intent intent = new Intent(AlarmClock.ACTION_SET_ALARM);
                  intent.putExtra(AlarmClock.EXTRA_HOUR, hour.intValue());
                  intent.putExtra(AlarmClock.EXTRA_MINUTES, minute.intValue());
                  intent.putExtra(AlarmClock.EXTRA_MESSAGE, label);
                  intent.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      getContext().startActivity(intent);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void setTimer(PluginCall call) {
                  Integer seconds = call.getInt("seconds");
                  if (seconds == null) {
                      call.reject("seconds is required");
                      return;
                  }
                  String label = call.getString("label", "MG.ai");
                  Intent intent = new Intent(AlarmClock.ACTION_SET_TIMER);
                  intent.putExtra(AlarmClock.EXTRA_LENGTH, seconds.intValue());
                  intent.putExtra(AlarmClock.EXTRA_MESSAGE, label);
                  intent.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      getContext().startActivity(intent);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVA_EOF
          cat > "$D/MainActivity.java" <<'JAVA_EOF'
          package com.mg.ai.app;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AssistantPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA_EOF
          ls -la "$D"

      - name: Set versionCode / versionName
        run: |
          F=$(ls android/app/build.gradle android/app/build.gradle.kts 2>/dev/null | head -1)
          sed -i -E "s/(versionCode[ =]+)[0-9]+/\1${BUILD_NUMBER}/" "$F"
          sed -i -E "s/(versionName[ =]+)\"[^\"]*\"/\1\"1.0.${BUILD_NUMBER}\"/" "$F"
          grep -nE "versionCode|versionName" "$F"
          grep -Eq "versionCode[ =]+${BUILD_NUMBER}\b" "$F" || (echo "versionCode patch failed" && exit 1)

      - name: Build release APK (unsigned)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK with the fixed key
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks "$KS_FILE" --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out MG-ai.apk aligned.apk
          "$BT/apksigner" verify --print-certs MG-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: MG.ai build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: MG-ai.apk
          make_latest: true
